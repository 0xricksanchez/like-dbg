# LIKE-DBG project tmux configuration.
# Fresh project server: tmux -L likedbg -f .tmux.conf new -s LIKE-DBG
# Reattach/list: tmux -L likedbg attach -t LIKE-DBG / tmux -L likedbg ls
# Existing tmux server: tmux source-file /path/to/like-dbg/.tmux.conf

# Keep tmux's default prefix so C-a stays available for QEMU/serial control.
set -g prefix C-b

# Predictable pane/window numbering.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Session behavior.
set -g detach-on-destroy off
set -g allow-rename off
setw -g automatic-rename off
setw -g aggressive-resize on
set -s escape-time 0

# Terminal behavior.
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:Tc"
set -g focus-events on
set -g mouse on
setw -g mode-keys vi
set -g history-limit 200000

# Status line.
set -g status-position bottom
set -g status-interval 5
set -g status-left-length 40
set -g status-right-length 120
set -g status-style "fg=#c7c9d1,bg=#20242c"
set -g status-left "#[fg=#20242c,bg=#9ece6a,bold] #{session_name} #[fg=#9ece6a,bg=#20242c]>"
set -g status-right "< #[fg=#7aa2f7]#{pane_current_command} #[fg=#565f89]| #[fg=#c7c9d1]%Y-%m-%d %H:%M "
setw -g window-status-format " #{window_index}:#{window_name}#{window_flags} "
setw -g window-status-current-format "#[fg=#111318,bg=#e0af68,bold] #{window_index}:#{window_name}#{window_flags} #[default]"
setw -g window-status-style "fg=#a9b1d6,bg=#20242c"
setw -g window-status-current-style "fg=#111318,bg=#e0af68,bold"
setw -g window-status-activity-style "fg=#f7768e,bg=#20242c"

# Pane navigation.
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -n M-Left select-pane -L
bind -n M-Down select-pane -D
bind -n M-Up select-pane -U
bind -n M-Right select-pane -R

# Pane resizing.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Preserve the current path when splitting panes or creating windows.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# LIKE-DBG controls. The application stores @likedbg_workspace in the session.
bind B run-shell -b 'if [ -n "#{@likedbg_workspace}" ]; then cd "#{@likedbg_workspace}" || { tmux display-message "LIKE-DBG restart failed: workspace unavailable"; exit 1; }; uv run ./start_kgdb --restart-debuggee; else tmux display-message "LIKE-DBG restart failed: missing @likedbg_workspace"; fi'

# LIKE-DBG: when the Debuggee pane's process exits (e.g. panic->reboot), auto-generate the crash report.
# Best-effort; the primary path is `start_kgdb --analyze-crash` run manually while stopped in GDB.
set-hook -g pane-died 'if-shell -F "#{&&:#{!=:#{@likedbg_debuggee_pane},},#{==:#{hook_pane},#{@likedbg_debuggee_pane}}}" "run-shell -b \"cd #{@likedbg_workspace} && uv run ./start_kgdb --analyze-crash >/dev/null 2>&1\""'
