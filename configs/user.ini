; like-dbg user overrides (new likedbg package schema).
; Only keys set here override system.ini; blank/absent keys fall back to it.

[general]
; arch ∈ [x86_64, arm64]
arch = arm64

[kernel_dl]
; Pin a MAJOR.MINOR.PATCH release. With the archive already in kernels/, the
; Download stage records it without re-fetching and the existing build is reused.
mmp = 6.6.30

[debugger]
; ext ∈ [gef, pwndbg]
ext = gef
