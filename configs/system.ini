; like-dbg base configuration (new likedbg package schema).
; Lowest-precedence layer: system.ini < user.ini < custom (-c) < CLI overrides.
; Blank values are treated as "unset" so the model default applies.

[general]
; Targeted architecture: x86_64 | arm64
arch = x86_64
; Optional descriptive tag to separate identical kernel versions
kernel_tag =
; Optional explicit workspace dir (blank = current working directory)
workspace_dir =
; macOS storage backend: auto | bind | volume (auto picks volume on case-insensitive FS)
mac_storage = auto

[kernel_dl]
; Version selection, precedence: mmp > tag > commit
mmp =
tag =
commit =

[kernel_builder]
; Compiler: clang | gcc
compiler = clang
; Cross toolchain: auto resolves from arch
toolchain = auto
; Config mode: generic | syzkaller | custom | config
mode = generic
; Enable Rust support
rust = no
; Extra kconfig args applied regardless of mode
extra_args =
; Optional kernel patch directory
patch_dir =
; Optional custom kernel modules directory
custom_modules =

[rootfs]
; Debian release the rootfs is based on
distribution = bookworm
; Guest hostname
hostname = LIKE-DBG

[debuggee]
; RAM (MiB)
memory = 1024
; vCPUs
smp = 1
; Enable KVM (Linux only)
kvm = no
; Enable the QEMU gdb stub (freeze at boot for the debugger)
gdb = yes
; Enable KASLR
kaslr = no
; Enable SMEP
smep = yes
; Enable SMAP
smap = yes
; Enable KPTI
kpti = yes
; panic behaviour: reboot | halt | wait <seconds>
panic = halt
; Acceleration: auto | kvm | hvf | tcg
accel = auto

[debugger]
; GDB extension: gef | pwndbg
ext = gef
