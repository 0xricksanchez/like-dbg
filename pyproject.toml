[project]
name = "like-dbg"
version = "1.0.0"
description = "Fully containerized Linux kernel debugging environment"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "loguru>=0.7",
    "pydantic>=2.7",
    "docker>=7.1",
    "tqdm>=4.66",
    "requests>=2.32",
    "platformdirs>=4.2",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-requests",
    "types-tqdm",
    "types-docker",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/likedbg"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]
force-exclude = true
extend-exclude = [
    "ctf",
    ".claude",
]

[tool.ruff.lint]
select = ["E", "F", "I", "C4", "PTH", "TID", "PERF", "N", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/likedbg"]
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
