name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-type-test:
    name: lint + type + test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject allows >=3.12; test the floor and the newest, since the container images
        # track a bleeding-edge Python and the host venv here already runs 3.14.
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          # pyproject declares >=3.12, so test the whole supported range rather than only its floor.
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Sync dependencies (locked)
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy src/likedbg

      - name: Pytest (with coverage)
        run: uv run pytest -q --cov=src/likedbg --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        # One upload, not one per matrix leg: the legs cover identical source.
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          # Public repos work without a token; supply one via secrets if the repo is private.
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
